server {
    listen 80;
    listen [::]:80;
    server_name localhost _;
    
    # Root directory and index files
    root /var/www/html/public;
    index index.php index.html;
    
    # Upload limit for GEDCOM files
    client_max_body_size 25M;
    
    # Handle PHP files - no cache
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        
        # Handle Authorization Header (equivalent to .htaccess RewriteRule)
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_param HTTP_X_XSRF_TOKEN $http_x_xsrf_token;
        
        # PHP files - no cache
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
    
    # Handle Laravel routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    
    # JavaScript files - 1 year cache (immutable)
    location ~* \.js$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }
    
    # CSS files - 1 year cache (immutable)
    location ~* \.css$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }
    
    # Images - 1 year cache (immutable)
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # Fonts - 1 year cache (immutable) with CORS
    location ~* \.(woff|woff2|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        access_log off;
    }
    
    # JSON files (manifests, etc.) - 1 year cache (immutable)
    location ~* \.json$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }
    
    # HTML files - no cache (always fresh)
    location ~* \.(html|htm)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
    
    # XML files - 1 month cache
    location ~* \.xml$ {
        expires 1M;
        add_header Cache-Control "public";
        access_log off;
    }
    
    # Text files - 1 month cache
    location ~* \.(txt|md)$ {
        expires 1M;
        add_header Cache-Control "public";
        access_log off;
    }
    
    # Deny access to hidden files and .htaccess
    location ~ /\.|~$ {
        deny all;
    }
    
    # Deny access to sensitive files
    location ~* \.(htaccess|htpasswd|ini|log|sh|sql|conf)$ {
        deny all;
    }
}
